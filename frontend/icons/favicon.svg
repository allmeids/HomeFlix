<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap');
      .logo-white {
        font-family: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
        font-size: 230px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 2px;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .logo-red {
        font-family: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
        font-size: 230px;
        font-weight: 900;
        fill: #E50914;
        letter-spacing: 2px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Fundo escuro cinematográfico com cantos arredondados -->
  <rect width="512" height="512" rx="104" fill="#101014" />
  <!-- Borda sutil de profundidade -->
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
  <!-- Texto da Logo Oficial: HOME (branco) FLIX (vermelho Netflix) -->
  <g filter="url(#shadow)">
    <text x="256" y="165" class="logo-white">HOME</text>
    <text x="256" y="368" class="logo-red">FLIX</text>
  </g>
</svg>
