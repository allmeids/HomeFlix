<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo escuro com cantos arredondados -->
  <rect width="512" height="512" rx="96" fill="#101014"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  
  <defs>
    <!-- Gradiente da fita horizontal da Netflix -->
    <linearGradient id="netflixRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3843"/>
      <stop offset="10%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B81D24"/>
    </linearGradient>
    <filter id="ribbonShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="-10" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Haste Esquerda Traseira (Vermelho Sombra com base curvada da Netflix) -->
  <path d="M 92 60 L 200 60 L 200 432 Q 146 414 92 452 Z" fill="#B81D24"/>

  <!-- Haste Direita Traseira (Vermelho Sombra com base curvada da Netflix) -->
  <path d="M 312 60 L 420 60 L 420 452 Q 366 414 312 432 Z" fill="#B81D24"/>

  <!-- Fita Horizontal Frontal Sobreposta com Efeito 3D Ribbon da Netflix -->
  <rect x="92" y="206" width="328" height="100" fill="url(#netflixRibbon)" filter="url(#ribbonShadow)"/>
</svg>
